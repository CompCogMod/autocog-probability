name: "Log-odds weighting with constant probability-space noise"
mean_rule: logodds_weighting
noise: probability_gaussian
theory: |
  People combine prior and evidence in log-odds space with the wrong weights, as in linear-in-log-odds accounts of base-rate neglect and conservatism: the central judgment is expit(alpha * prior log-odds + beta * log LR), with alpha = beta = 1 recovering Bayes. This distortion happens when the judgment is formed and is deterministic. Unlike the standard formulation, the response noise is constant in probability space (standard deviation tau) rather than in log-odds space, so reports are as variable near 0% or 100% as near 50%. Together with the log-odds-noise version, this separates the effect of the mean distortion from the effect of where the noise lives. A lapse rate epsilon gives occasional random reports.
predict: |
  def predict(parameters, stimulus, history):
      # See bayes_noise.yaml for the stimulus / output contract.
      from scipy.special import ndtr
      K = 101
      scalar = np.ndim(stimulus["prior"]) == 0
      prior = np.clip(np.atleast_1d(np.asarray(stimulus["prior"], dtype=float)), 1e-6, 1 - 1e-6)
      llr = np.atleast_1d(np.asarray(stimulus["log_lr"], dtype=float))
      alpha = float(parameters["alpha"])
      beta = float(parameters["beta"])
      m = 1.0 / (1.0 + np.exp(-(alpha * (np.log(prior) - np.log1p(-prior)) + beta * llr)))

      edges = (np.arange(K + 1) - 0.5) / (K - 1)
      edges[0], edges[-1] = -np.inf, np.inf
      tau = float(parameters["tau"])
      probs = np.diff(ndtr((edges[None, :] - m[:, None]) / tau), axis=1)

      eps = float(parameters["epsilon"])
      probs = (1.0 - eps) * probs + eps / K
      probs = probs / probs.sum(axis=1, keepdims=True)
      return probs[0] if scalar else probs
policy: |
  def policy(probabilities):
      probabilities = probabilities / probabilities.sum()
      return int(np.random.choice(len(probabilities), p=probabilities))
parameters:
  alpha: "[0.0, 3.0]"      # weight on prior log-odds
  beta: "[0.0, 3.0]"       # weight on evidence log LR
  tau: "[0.005, 0.5]"      # response noise in probability units
  epsilon: "[0.0, 0.6]"    # lapse rate
