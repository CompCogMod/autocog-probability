name: "Bayesian sampler (Zhu, Sanborn & Chater 2020)"
mean_rule: compression
noise: sampling
theory: |
  Probability distortion is a by-product of the algorithm that produces the judgment, not a bias in how prior and evidence are weighted. People represent the correct Bayesian posterior implicitly and estimate it by drawing a small number N of mental samples from it, counting the k samples in which H holds. Rather than reporting the raw proportion k/N, they apply a symmetric Beta(b, b) prior over probabilities, reporting (k + b) / (N + 2b). Averaged over trials this shrinks reports toward 50% by the factor N / (N + 2b), and the trial-to-trial variability is binomial: largest for posteriors near 50% and vanishing as the posterior approaches 0 or 1, with fewer samples giving both more variability and more shrinkage. Mean distortion and response variability are therefore linked through the same N. Reported values fall on the discrete set (k + b)/(N + 2b); a small motor/reporting noise tau smears them onto the 0-100 scale, and a lapse rate epsilon gives occasional random reports. Non-integer N is handled by mixing the neighbouring integer sample sizes.
predict: |
  def predict(parameters, stimulus, history):
      # See bayes_noise.yaml for the stimulus / output contract.
      from scipy.special import ndtr
      from scipy.stats import binom
      K = 101
      scalar = np.ndim(stimulus["prior"]) == 0
      prior = np.clip(np.atleast_1d(np.asarray(stimulus["prior"], dtype=float)), 1e-6, 1 - 1e-6)
      llr = np.atleast_1d(np.asarray(stimulus["log_lr"], dtype=float))
      bayes = 1.0 / (1.0 + np.exp(-(np.log(prior) - np.log1p(-prior) + llr)))

      b = float(parameters["b"])
      tau = float(parameters["tau"])
      edges = (np.arange(K + 1) - 0.5) / (K - 1)
      edges[0], edges[-1] = -np.inf, np.inf

      def report_dist(n):
          # P(report bin | Bayesian posterior) for exactly n samples.
          k = np.arange(n + 1)
          pmf = binom.pmf(k[None, :], n, bayes[:, None])            # (trials, n+1)
          values = (k + b) / (n + 2.0 * b)                            # (n+1,)
          to_bins = np.diff(ndtr((edges[None, :] - values[:, None]) / tau), axis=1)  # (n+1, K)
          return pmf @ to_bins

      N = float(parameters["N"])
      n0 = max(int(np.floor(N)), 1)
      w = min(max(N - n0, 0.0), 1.0)
      probs = report_dist(n0) if w == 0.0 else (1.0 - w) * report_dist(n0) + w * report_dist(n0 + 1)

      eps = float(parameters["epsilon"])
      probs = (1.0 - eps) * probs + eps / K
      probs = probs / probs.sum(axis=1, keepdims=True)
      return probs[0] if scalar else probs
policy: |
  def policy(probabilities):
      probabilities = probabilities / probabilities.sum()
      return int(np.random.choice(len(probabilities), p=probabilities))
parameters:
  N: "[1.0, 200.0]"         # number of mental samples
  b: "[0.0, 20.0]"          # symmetric Beta(b, b) prior used to correct the sample proportion
  tau: "[0.005, 0.2]"      # motor / reporting noise in probability units
  epsilon: "[0.0, 0.6]"    # lapse rate
